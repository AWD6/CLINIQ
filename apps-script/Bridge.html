<!doctype html>
<html>
  <head><base target="_top"><meta charset="utf-8"></head>
  <body>
    <script>
      window.addEventListener('message', function(event) {
        if (event.source !== window.top || !event.data || event.data.type !== 'request') return;
        var message = event.data;
        google.script.run
          .withSuccessHandler(function(result) {
            window.top.postMessage({ type: 'response', id: message.id, data: result && result.data, error: result && result.error }, '*');
          })
          .withFailureHandler(function(error) {
            window.top.postMessage({ type: 'response', id: message.id, error: String(error && error.message || error) }, '*');
          })
          .apiCall(message.action, message.payload || {}, message.credential || '');
      });
      window.top.postMessage({ type: 'bridge-ready' }, '*');
    </script>
  </body>
</html>
